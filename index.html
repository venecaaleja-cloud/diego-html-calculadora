<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Edad</title>
    <!-- CSS de Flatpickr desde internet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="Styles.css">
</head>
<body>

    <div class="contenedor">
        <h1>Calculadora de Edad</h1>
        
        <div class="grupo-input">
            <label for="fechaNacimiento">Ingresa tu fecha de nacimiento:</label>
            <input type="text" id="fechaNacimiento" placeholder="DD/MM/AAAA">
            <span id="mensajeError" class="error"></span>
        </div>

        <button id="btnCalcular">Calcular</button>

        <h2 id="resultado" style="display: none;">Tienes <span id="textoEdad"></span> de edad</h2>
    </div>

    <!-- ¡OJO AQUÍ! Cargamos Luxon y Flatpickr desde internet ANTES de tu script -->
    <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
    
    <!-- Tu script normal, SIN type="module" -->
    <script src="java.js"></script>
</body>
</html>
